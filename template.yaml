AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FarmerChat MEL - Fargate worker, private PostgreSQL, S3 data, and the MEL console (CloudFront UI, Cognito sign-in, Lambda API).

Parameters:
  ContainerImage:
    Type: String
    Description: Full ECR image URI with immutable tag or digest, built before deployment.
  BedrockModelId:
    Type: String
    Default: openai.gpt-6-luna
    Description: Bedrock Mantle model ID; GPT-6 Luna is served in us-east-1.
  BedrockAllowedModelIds:
    Type: CommaDelimitedList
    Default: openai.gpt-6-luna
    Description: Model names allowed for inference; include generation and review IDs.
  ConverseModelIds:
    Type: CommaDelimitedList
    # Each passed a Converse tool-call check in this account (4 Nov 2026). Llama 4 is
    # left out: it does not support tools, which structured survey output needs.
    Default: us.anthropic.claude-haiku-5-5,us.anthropic.claude-sonnet-5-5,us.anthropic.claude-opus-5-5,us.amazon.nova-pro-v1:0,us.amazon.nova-2-lite-v1:0,mistral.mistral-large-3-675b-instruct,deepseek.v3.2,global.openai.gpt-5.5
    Description: Bedrock Converse model or inference-profile IDs saved versions may use.
  AgentRuntimeArn:
    Type: String
    Description: ARN of the AgentCore runtime running agents/main.py (agentcore status).
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
  DatabaseName:
    Type: String
    Default: farmerchat
    AllowedPattern: '[a-z][a-z0-9]{0,62}'
  DatabaseBackupDays:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 35

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  WorkerSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  WorkerRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  WorkerRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WorkerSubnet
      RouteTableId: !Ref WorkerRoutes
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref WorkerRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Isolated database subnets; no internet routes.
      SubnetIds: [!Ref DatabaseSubnetA, !Ref DatabaseSubnetB]
  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Batch worker - no inbound connections.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.42.0.0/16
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL reachable only by the worker security group.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref WorkerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 127.0.0.1/32
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DatabaseName
      MasterUsername: meladmin
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: !Ref DatabaseBackupDays
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt DataBucket.Arn, !Sub '${DataBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  Cluster:
    Type: AWS::ECS::Cluster
  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WorkerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: !Sub 'arn:${AWS::Partition}:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:project/default'
                Condition:
                  StringEquals:
                    bedrock-mantle:Model: !Ref BedrockAllowedModelIds
              # Converse candidates. The console allows only ConverseModelIds; inference
              # profiles route across regions, so both resource kinds span regions.
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                  - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub '${DataBucket.Arn}/inputs/*'
                  - !Sub '${DataBucket.Arn}/config/*'
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${DataBucket.Arn}/outputs/*'
  WorkerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Ref ContainerImage
          Essential: true
          ReadonlyRootFilesystem: true
          Environment:
            - Name: PYTHONDONTWRITEBYTECODE
              Value: '1'
            - Name: MEL_AWS_REGION
              Value: !Ref AWS::Region
            - Name: MEL_BEDROCK_MODEL_ID
              Value: !Ref BedrockModelId
            - Name: MEL_DATABASE_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: MEL_DATABASE_NAME
              Value: !Ref DatabaseName
            - Name: MEL_DATABASE_SECRET_ARN
              Value: !GetAtt Database.MasterUserSecret.SecretArn
            - Name: MEL_DATABASE_SSLMODE
              Value: verify-full
            - Name: MEL_DATABASE_SSLROOTCERT
              Value: /app/certs/global-bundle.pem
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker

  # MEL console. The API Lambda runs in a private subnet whose NAT gateway reaches
  # AWS APIs (Secrets Manager, ECS, the Bedrock catalog); the database stays isolated.
  AppSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.20.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  AppRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  AppRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnet
      RouteTableId: !Ref AppRoutes
  NatAddress:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatAddress.AllocationId
      SubnetId: !Ref WorkerSubnet
  AppNatRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRoutes
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  ConsoleApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Console API Lambda - no inbound connections.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.42.0.0/16
  DatabaseFromConsoleApi:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ConsoleApiSecurityGroup

  # Sign-in: administrators create users; there is no self sign-up.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub '${AWS::StackName}-${AWS::AccountId}'
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub 'https://${UiDistribution.DomainName}/api/auth/callback']
      LogoutURLs: [!Sub 'https://${UiDistribution.DomainName}/']
      AccessTokenValidity: 8
      IdTokenValidity: 8
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
      PreventUserExistenceErrors: ENABLED

  # The API has no CORS and no gateway authorizer: CloudFront serves it on the console's
  # own origin, and the application checks the session cookie (src/mel/explorer/auth.py).
  # Routes are separate resources so the API itself does not depend on the function,
  # which needs the CloudFront domain for its sign-in redirects.
  ConsoleApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-console'
      ProtocolType: HTTP
  ConsoleApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ConsoleApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ConsoleApiFunction.Arn
      PayloadFormatVersion: '2.0'
  ConsoleApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ConsoleApi
      RouteKey: ANY /api/{proxy+}
      Target: !Sub 'integrations/${ConsoleApiIntegration}'
  ConsoleApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ConsoleApi
      StageName: $default
      AutoDeploy: true
  ConsoleApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ConsoleApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ConsoleApi}/*'
  ConsoleApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref ContainerImage
      ImageConfig:
        EntryPoint: [mel-explorer]
        Command: [--host, 0.0.0.0, --port, '8080']
      Architectures: [x86_64]
      MemorySize: 1024
      # API Gateway still answers web requests within 29 s. The longer limit is for the
      # Agents tab's background runs: the function invokes itself asynchronously and waits
      # on the AgentCore survey agent (15-60 s, up to a few minutes with revisions).
      Timeout: 300
      VpcConfig:
        SubnetIds: [!Ref AppSubnet]
        SecurityGroupIds: [!Ref ConsoleApiSecurityGroup]
      Environment:
        Variables:
          AWS_LWA_PORT: '8080'
          AWS_LWA_READINESS_CHECK_PATH: /
          AWS_LWA_ASYNC_INIT: 'true'
          PYTHONDONTWRITEBYTECODE: '1'
          MEL_AWS_REGION: !Ref AWS::Region
          MEL_BEDROCK_MODEL_ID: !Ref BedrockModelId
          MEL_DATABASE_HOST: !GetAtt Database.Endpoint.Address
          MEL_DATABASE_NAME: !Ref DatabaseName
          MEL_DATABASE_SECRET_ARN: !GetAtt Database.MasterUserSecret.SecretArn
          MEL_DATABASE_SSLMODE: verify-full
          MEL_DATABASE_SSLROOTCERT: /app/certs/global-bundle.pem
          MEL_JOB_CLUSTER: !Ref Cluster
          MEL_JOB_TASK_DEFINITION: !Ref WorkerTask
          MEL_JOB_SUBNETS: !Sub '["${WorkerSubnet}"]'
          MEL_JOB_SECURITY_GROUPS: !Sub '["${WorkerSecurityGroup}"]'
          MEL_AUTH_DOMAIN: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
          MEL_AUTH_CLIENT_ID: !Ref UserPoolClient
          MEL_AUTH_ISSUER: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
          MEL_CONSOLE_URL: !Sub 'https://${UiDistribution.DomainName}'
          MEL_PACK_URI: !Sub 's3://${DataBucket}/datasets/participant-pack/insights.jsonl'
          # Agents tab: the Strands survey agents on Bedrock AgentCore (agents/README.md).
          MEL_AGENT_RUNTIME_ARN: !Ref AgentRuntimeArn
          MEL_AGENT_RESULTS_URI: !Sub 's3://${DataBucket}/agent-runs'
          MEL_AGENT_SUMMARIES_URI: !Sub 's3://${DataBucket}/agent-sweeps/summaries.json'
          # Saved versions may only use the models the worker's IAM policy allows.
          MEL_ALLOWED_MODELS: !Sub
            - '[{"api":"responses","model_id":"${Mantle}"},{"api":"converse","model_id":"${Converse}"}]'
            - Mantle: !Join ['"},{"api":"responses","model_id":"', !Ref BedrockAllowedModelIds]
              Converse: !Join ['"},{"api":"converse","model_id":"', !Ref ConverseModelIds]
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt Database.MasterUserSecret.SecretArn
            - Effect: Allow
              Action: ecs:RunTask
              Resource: !Ref WorkerTask
              Condition:
                ArnEquals:
                  ecs:cluster: !GetAtt Cluster.Arn
            - Effect: Allow
              Action: iam:PassRole
              Resource: [!GetAtt ExecutionRole.Arn, !GetAtt WorkerRole.Arn]
            - Effect: Allow
              Action: [bedrock:ListFoundationModels, bedrock:ListInferenceProfiles]
              Resource: '*'
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${DataBucket.Arn}/datasets/*'
            # Agents tab
            - Effect: Allow
              Action: bedrock-agentcore:InvokeAgentRuntime
              Resource: [!Ref AgentRuntimeArn, !Sub '${AgentRuntimeArn}/*']
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub '${DataBucket.Arn}/agent-runs/*'
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${DataBucket.Arn}/agent-sweeps/*'
            # The function starts background agent runs by invoking itself. A name pattern,
            # not GetAtt, avoids a circular reference.
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-ConsoleApiFunction-*'

  # Console origin: the UI from a private bucket, and /api/* from the console API, so
  # the browser sees one origin (no CORS) and session cookies stay first-party.
  UiBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  UiOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-ui'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  UiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} MEL console'
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: ui
            DomainName: !GetAtt UiBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt UiOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Sub '${ConsoleApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            # Managed CachingDisabled and AllViewerExceptHostHeader: nothing is cached,
            # and cookies, query strings and headers reach the API.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        DefaultCacheBehavior:
          TargetOriginId: ui
          ViewerProtocolPolicy: redirect-to-https
          # Managed CachingOptimized; deploy.sh invalidates after each upload.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
  UiBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UiBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${UiBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${UiDistribution}'
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt UiBucket.Arn, !Sub '${UiBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  BedrockModelId:
    Value: !Ref BedrockModelId
  ClusterArn:
    Value: !GetAtt Cluster.Arn
  WorkerTaskDefinitionArn:
    Value: !Ref WorkerTask
  WorkerSubnetId:
    Value: !Ref WorkerSubnet
  WorkerSecurityGroupId:
    Value: !Ref WorkerSecurityGroup
  DataBucketName:
    Value: !Ref DataBucket
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  WorkerLogGroup:
    Value: !Ref WorkerLogs
  ConsoleUrl:
    Value: !Sub 'https://${UiDistribution.DomainName}/'
  ConsoleApiUrl:
    Description: Direct API Gateway address; the console uses CloudFront's /api/* instead.
    Value: !Sub 'https://${ConsoleApi}.execute-api.${AWS::Region}.amazonaws.com'
  UiBucketName:
    Value: !Ref UiBucket
  UiDistributionId:
    Value: !Ref UiDistribution
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  UserPoolDomainUrl:
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
