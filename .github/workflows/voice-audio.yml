# Records the voice demo's missing clips, so GitHub Pages plays every demo survey aloud
# without anyone running voice/render_audio.py by hand. See voice/README.md.
name: Record voice clips

on:
  push:
    branches: [main]
    # The surveys and the wording the clips are made from. The clips themselves
    # (docs/voice/audio) are not listed, so this workflow's own commit does not start it.
    paths:
      - docs/voice/generated/**
      - docs/voice/survey-session.mjs
      - src/mel/voice.py
      - voice/render_audio.py
      - docs/participant-pack/json/scenarios/*/survey.*.json
  workflow_dispatch:

permissions:
  contents: write # commit the clips
  pages: write # rebuild the site after that commit

concurrency:
  group: voice-audio
  cancel-in-progress: false

jobs:
  record:
    # A manual run can pick any branch. Only main may be recorded and pushed, or the
    # push below would also publish that branch's unmerged commits.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The newest main, not the commit that started the run: a rerun of an old run must
      # see the clips that run already committed, or it records and pushes them again.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
      - name: Record missing clips
        # Fails loudly when the key is missing, expired or out of credits.
        run: uv run --frozen --no-dev python voice/render_audio.py
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - name: Commit the clips
        run: |
          git add -A docs/voice/audio
          if git diff --cached --quiet; then
            echo "Every clip is already recorded."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record voice clips for the demo surveys"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      # A push made with the workflow token does not start a Pages build. Ask for one on
      # every run, even after a failed step, so a rerun also repairs a failed request.
      - name: Rebuild the site
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
