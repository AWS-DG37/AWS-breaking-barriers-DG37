services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: farmerchat
      POSTGRES_USER: mel
      POSTGRES_PASSWORD: mel-local-only
    ports:
      - '127.0.0.1:${MEL_LOCAL_DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mel -d farmerchat']
      interval: 5s
      timeout: 3s
      retries: 10
  explorer:
    build: .
    entrypoint: [mel-explorer, --host, 0.0.0.0, --port, '8080', --no-live]
    ports:
      - '127.0.0.1:${MEL_EXPLORER_PORT:-8080}:8080'
    environment:
      MEL_EXPLORER_ALLOWED_ORIGINS: '${MEL_EXPLORER_ALLOWED_ORIGINS:-["http://localhost:${MEL_EXPLORER_PORT:-8080}","http://127.0.0.1:${MEL_EXPLORER_PORT:-8080}"]}'
      MEL_DATABASE_HOST: postgres
      MEL_DATABASE_SSLMODE: disable
      AWS_EC2_METADATA_DISABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
