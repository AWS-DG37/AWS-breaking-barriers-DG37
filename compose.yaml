services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: farmerchat
      POSTGRES_USER: mel
      POSTGRES_PASSWORD: mel-local-only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mel -d farmerchat']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
