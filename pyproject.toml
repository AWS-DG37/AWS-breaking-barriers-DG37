[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "farmerchat-mel"
version = "0.1.0"
description = "Configurable FarmerChat survey generation worker"
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.35,<2",
  "pydantic>=2.12,<3",
  "pydantic-ai-slim[openai,bedrock]==1.84.1",
  "openai>=2.30,<3",
  "httpx>=0.28,<1",
  "botocore>=1.35,<2",
  "pydantic-graph==1.84.1",
  # 0.1 adds output_reasoning_tokens, which pydantic-ai 1.84.1's RequestUsage rejects;
  # pydantic-ai swallows the error and reports zero tokens. Lift with a pydantic-ai upgrade.
  "genai-prices<0.1",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
  "referencing>=0.36,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.11,<1",
    "cfn-lint>=1,<2",
    "pytest>=9,<10",
    "streamlit>=1.66.1,<2",
    "playwright>=1.55,<2",
]

[project.scripts]
mel-worker = "mel.worker:main"
mel-explorer = "mel.explorer.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mel", "dg_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
