[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "farmerchat-mel"
version = "0.1.0"
description = "Configurable FarmerChat survey generation worker"
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.35,<2",
  "pydantic>=2.12,<3",
  "pydantic-ai-slim[openai]==1.84.1",
  "openai>=2.30,<3",
  "httpx>=0.28,<1",
  "botocore>=1.35,<2",
  "pydantic-graph==1.84.1",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
  "referencing>=0.36,<1",
]

[dependency-groups]
dev = ["ruff>=0.11,<1", "cfn-lint>=1,<2"]

[project.scripts]
mel-worker = "mel.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mel"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
