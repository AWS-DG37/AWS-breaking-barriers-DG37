AWSTemplateFormatVersion: '2010-09-09'
Description: Independent retained Field Echo console sign-in (no deployment or account list).
Parameters:
  ConsoleUrl:
    Type: String
    Default: https://fieldecho.org
    AllowedPattern: 'https://[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+'
    Description: HTTPS console origin without a path or trailing slash.
  HostedDomainPrefix:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9-]{1,61}[a-z0-9]'
    Description: Globally unique Cognito hosted UI prefix; reuse the existing stack on later runs.
Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: fieldecho
      UserPoolTags:
        Application: FieldEcho
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref HostedDomainPrefix
      # Managed login shows the FieldEcho style from deploy/cognito_branding.py.
      ManagedLoginVersion: 2
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: fieldecho-console
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub '${ConsoleUrl}/api/auth/callback']
      LogoutURLs: [!Sub '${ConsoleUrl}/']
      AccessTokenValidity: 8
      IdTokenValidity: 8
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
      PreventUserExistenceErrors: ENABLED
Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  AuthDomain:
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  AuthIssuer:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
  ConsoleUrl:
    Value: !Ref ConsoleUrl
