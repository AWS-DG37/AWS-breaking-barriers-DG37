AWSTemplateFormatVersion: '2010-09-09'
Description: Opt-in private EC2 explorer foundation. Does not configure shared delivery or DNS.
Parameters:
  Namespace:
    Type: String
    AllowedPattern: '[a-z][a-z0-9-]{2,29}'
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Existing subnet with IPv4, available addresses, and outbound internet through its VPC IGW.
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Operator-verified Amazon Linux 2023 x86_64 AMI in this region.
  DataVolumeSize:
    Type: Number
    Default: 40
    MinValue: 20
    MaxValue: 1024
  DatasetBucket:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'
  DatasetKey:
    Type: String
    AllowedPattern: '[A-Za-z0-9_./-]{1,512}'
  DatasetVersion:
    Type: String
    AllowedPattern: '[A-Za-z0-9_+=./-]{1,1024}'
    Description: Approved immutable object version. Do not use the literal null version.
  ModelPolicyArn:
    Type: String
    Default: ''
    AllowedPattern: '(^$|arn:aws:iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+)'
    Description: Optional existing least-privilege inference policy. Bootstrap always runs offline.
  CloudFrontServiceSecurityGroupId:
    Type: String
    Default: ''
    AllowedPattern: '(^$|sg-[0-9a-f]{17})'
    Description: Leave blank initially. Set only with configure-origin after the VPC origin deploys.
  ConsoleHostname:
    Type: String
    Default: ''
    AllowedPattern: '(^$|[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+)'
  CertificateArn:
    Type: String
    Default: ''
    AllowedPattern: '(^$|arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]{36})'
    Description: Existing validated certificate for ConsoleHostname in us-east-1. DNS stays operator-owned.
Rules:
  DomainAndCertificateTogether:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref ConsoleHostname, '']
            - !Equals [!Ref CertificateArn, '']
          - !And
            - !Not [!Equals [!Ref ConsoleHostname, '']]
            - !Not [!Equals [!Ref CertificateArn, '']]
        AssertDescription: Supply both ConsoleHostname and CertificateArn, or leave both blank.
Conditions:
  HasModelPolicy: !Not [!Equals [!Ref ModelPolicyArn, '']]
  HasCloudFrontServiceGroup: !Not [!Equals [!Ref CloudFrontServiceSecurityGroupId, '']]
  HasDomain: !Not [!Equals [!Ref CertificateArn, '']]
Resources:
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub '${Namespace}-explorer'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
  HostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
        - !If [HasModelPolicy, !Ref ModelPolicyArn, !Ref 'AWS::NoValue']
      Policies:
        - PolicyName: ImmutableArtifacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action: s3:GetObjectVersion
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DatasetBucket}/${DatasetKey}'
                Condition:
                  StringEquals:
                    s3:VersionId: !Ref DatasetVersion
  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HostRole]
  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${Namespace} private CloudFront origin; ingress configured separately'
      VpcId: !Ref VpcId
      SecurityGroupIngress: []
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${Namespace}-origin'
  Host:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t3.small
      IamInstanceProfile: !Ref HostProfile
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref HostSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 16
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${Namespace}-explorer'
        - Key: dg37:namespace
          Value: !Ref Namespace
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker nginx python3 awscli-2 e2fsprogs util-linux
          install -d -m 0755 /usr/local/lib/docker/cli-plugins
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          printf '%s\n' '7af95166a730b87e172d4fc9aefea8725d3c6c7327d59149267b452114ddb7d4  /usr/local/lib/docker/cli-plugins/docker-compose' | sha256sum -c -
          chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose
          docker compose version --short | grep -Fx '2.39.4'
          cat > /etc/nginx/nginx.conf <<'NGINX'
          events {}
          http { server { listen 80 default_server; location / { return 503; } } }
          NGINX
          systemctl enable --now docker nginx amazon-ssm-agent
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt Host.AvailabilityZone
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub '${Namespace}-state'
        - Key: dg37:namespace
          Value: !Ref Namespace
  DataAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref Host
      VolumeId: !Ref DataVolume
  VpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub '${Namespace}-origin'
        Arn: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Host}'
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only
        OriginSSLProtocols: [TLSv1.2]
  CloudFrontIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasCloudFrontServiceGroup
    Properties:
      GroupId: !Ref HostSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref CloudFrontServiceSecurityGroupId
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: !If [HasDomain, [!Ref ConsoleHostname], !Ref 'AWS::NoValue']
        Origins:
          - Id: private-explorer
            DomainName: !GetAtt Host.PrivateDnsName
            VpcOriginConfig:
              VpcOriginId: !GetAtt VpcOrigin.Id
        DefaultCacheBehavior:
          TargetOriginId: private-explorer
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 413f160d-6e51-4a2e-81aa-9df6b5a96c2d
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          Compress: true
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
Outputs:
  InstanceId:
    Value: !Ref Host
  VolumeId:
    Value: !Ref DataVolume
  VpcOriginId:
    Value: !GetAtt VpcOrigin.Id
  HostSecurityGroupId:
    Value: !Ref HostSecurityGroup
  VpcId:
    Value: !Ref VpcId
  SubnetId:
    Value: !Ref SubnetId
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  HostRoleArn:
    Value: !GetAtt HostRole.Arn
  ConsoleUrl:
    Value: !If [HasDomain, !Sub 'https://${ConsoleHostname}', !Sub 'https://${Distribution.DomainName}']
